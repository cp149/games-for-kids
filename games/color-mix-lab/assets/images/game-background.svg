<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Color -->
  <rect width="800" height="600" fill="#FFF9F0"/>
  
  <!-- Subtle Organic Patterns -->
  <g opacity="0.4">
    <!-- Soft Waves -->
    <path d="M0 100 Q 200 50 400 100 T 800 100" fill="none" stroke="#FFE66D" stroke-width="2"/>
    <path d="M0 500 Q 200 550 400 500 T 800 500" fill="none" stroke="#448AFF" stroke-width="2"/>
  </g>

  <!-- Playful Bubbles -->
  <g opacity="0.15">
    <!-- Red Bubbles -->
    <circle cx="120" cy="150" r="40" fill="#FF6B6B"/>
    <circle cx="650" cy="420" r="25" fill="#FF6B6B"/>
    <circle cx="400" cy="80" r="15" fill="#FF6B6B"/>
    
    <!-- Blue Bubbles -->
    <circle cx="700" cy="120" r="35" fill="#448AFF"/>
    <circle cx="150" cy="480" r="45" fill="#448AFF"/>
    <circle cx="500" cy="550" r="20" fill="#448AFF"/>
    
    <!-- Yellow Bubbles -->
    <circle cx="50" cy="300" r="30" fill="#FFE66D"/>
    <circle cx="750" cy="350" r="40" fill="#FFE66D"/>
    <circle cx="320" cy="520" r="18" fill="#FFE66D"/>
  </g>

  <!-- Sparkles -->
  <g fill="#FFFFFF" opacity="0.6">
    <path d="M200 200 L205 215 L220 220 L205 225 L200 240 L195 225 L180 220 L195 215 Z"/>
    <path d="M600 450 L603 458 L610 460 L603 462 L600 470 L597 462 L590 460 L597 458 Z" transform="scale(0.8)"/>
    <circle cx="450" cy="250" r="3"/>
    <circle cx="100" cy="100" r="2"/>
    <circle cx="700" cy="500" r="4"/>
  </g>
</svg>
