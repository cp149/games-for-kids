<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Color Mix Lab - Learn color mixing through play!">
  <title>Color Mix Lab</title>
  <!-- Playful fonts for children's app -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=27">
</head>
<body>
  <div id="game-container"></div>

  <!-- Shared libraries -->
  <script src="../lib/stats.min.js"></script>
  <script type="module">
    import { Logger } from '../lib/utils/Logger.js';
    import { PerformanceMonitor } from '../lib/performance-monitor.js';
    import { SimpleI18n } from '../lib/i18n/SimpleI18n.js';
    window.Logger = Logger;
    window.PerformanceMonitor = PerformanceMonitor;
    window.SimpleI18n = SimpleI18n;
  </script>

  <!-- i18n -->
  <script src="js/i18n/translations.js?v=1"></script>

  <!-- Game scripts -->
  <script src="js/config.js?v=6"></script>
  <script src="js/classes/Level.js?v=2"></script>
  <script src="js/managers/LevelManager.js?v=2"></script>
  <script src="js/systems/MixingSystem.js?v=5"></script>
  <script src="js/managers/DragManager.js?v=5"></script>
  <script src="js/managers/UIManager.js?v=6"></script>
  <script src="js/managers/AudioManager.js?v=5"></script>
  <script src="js/ColorMixGame.js?v=7"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Initialize i18n with browser language detection
      const browserLang = navigator.language.startsWith('zh') ? 'zh' : 'en';
      const savedLang = localStorage.getItem('colorMixLab_language') || browserLang;

      window.i18n = new SimpleI18n(savedLang);
      window.i18n.addTranslations(TRANSLATIONS);

      window.game = new ColorMixGame('game-container');

      // Cleanup on page unload
      window.addEventListener('beforeunload', () => {
        if (window.game) window.game.destroy();
      });
    });
  </script>
</body>
</html>
