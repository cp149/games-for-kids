<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 Color Mix Lab - Learn Colors Through Play</title>
    <meta name="description" content="Mix colors, feed the chameleon, and discover the rainbow! Educational game for ages 5-8.">

    <link rel="stylesheet" href="css/styles.css">

    <!-- Stats.js for performance monitoring (dev only) -->
    <script src="https://cdn.jsdelivr.net/npm/stats.js@0.17.0/build/stats.min.js"></script>
</head>
<body>
    <!-- Living Background Elements -->
    <div class="living-bg">
        <div class="cloud cloud-1">☁️</div>
        <div class="cloud cloud-2">☁️</div>
        <div class="butterfly butterfly-1">🦋</div>
        <div class="butterfly butterfly-2">🦋</div>
        <div class="leaf leaf-1">🍃</div>
    </div>

    <div id="game-container" class="game-container">
        <!-- Header Area: Settings, Sound, Sticker Book, Free Play -->
        <header class="header-area">
            <button class="icon-btn sticker-book-btn" aria-label="Sticker Book">
                <span class="icon-sticker">📖</span>
            </button>
            <button class="icon-btn free-play-btn hidden" aria-label="Free Play Mode">
                <span class="icon-free-play">🎨</span>
            </button>
            <button class="icon-btn settings-btn" aria-label="Settings">
                <span class="icon-settings"></span>
            </button>
            <button class="icon-btn sound-btn" aria-label="Toggle Sound">
                <span class="icon-sound"></span>
            </button>
        </header>

        <!-- Chameleon Area: Character & Goal -->
        <section class="chameleon-area">
            <div class="target-leaf">
                <div class="chameleon">
                    <div class="chameleon-body"></div>
                    <div class="chameleon-eyes"></div>
                </div>
            </div>
            <div class="progress-stars">
                <span class="star"></span>
                <span class="star"></span>
                <span class="star"></span>
            </div>
        </section>

        <!-- Mixing Area: Bowl & Buttons -->
        <section class="mixing-area">
            <div class="bowl">
                <div class="liquid"></div>
                <div class="particles"></div>
            </div>
            <div class="bowl-controls">
                <button class="icon-btn undo-btn hidden" aria-label="Undo">
                    <span class="icon-undo">↩️</span>
                </button>
                <button class="icon-btn clear-btn" aria-label="Clear Bowl">
                    <span class="icon-clear"></span>
                </button>
            </div>
        </section>

        <!-- Palette Area: Color Sources -->
        <section class="palette-area">
            <div class="color-source red-source" data-color="red" draggable="true">
                <div class="color-blob"></div>
                <div class="color-pattern pattern-zigzag"></div>
            </div>
            <div class="color-source blue-source" data-color="blue" draggable="true">
                <div class="color-blob"></div>
                <div class="color-pattern pattern-waves"></div>
            </div>
            <div class="color-source yellow-source" data-color="yellow" draggable="true">
                <div class="color-blob"></div>
                <div class="color-pattern pattern-dots"></div>
            </div>
        </section>
    </div>

    <!-- ES Module entry point -->
    <script type="module">
        // Import shared utilities
        import { Logger, setLogLevel } from '../lib/utils/Logger.js';

        // Import performance monitor
        import { PerformanceMonitor } from '../lib/performance-monitor.js';

        // Import game modules
        import { TRANSLATIONS } from './js/i18n/translations.js';
        import { initI18n } from './js/i18n/index.js';
        import { ColorMixGame } from './js/ColorMixGame.js';

        // Game instance (declared at top to avoid TDZ issues)
        let game = null;

        // Make Logger globally available for compatibility
        window.Logger = Logger;

        // Initialize performance monitor (dev mode only)
        const perfMonitor = new PerformanceMonitor({
            position: 'bottom-left',
            showFPS: true,
            showMS: true,
            showMB: false,
            logger: Logger
        });
        perfMonitor.init();

        // Initialize i18n
        const i18n = initI18n(TRANSLATIONS, 'en');

        // Initialize game when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initGame);
        } else {
            initGame();
        }

        function initGame() {
            try {
                Logger.info('🎨 Color Mix Lab initializing...');
                game = new ColorMixGame('game-container', i18n);
                Logger.info('✅ Game initialized successfully');

                // Start game loop for performance monitoring
                if (perfMonitor.isEnabled()) {
                    requestAnimationFrame(gameLoop);
                }
            } catch (error) {
                Logger.error('❌ Failed to initialize game:', error);
                document.getElementById('game-container').innerHTML = `
                    <div class="game-loading">
                        <div style="text-align: center; color: #E74C3C;">
                            <h2>😕 ${i18n.t('game_title')}</h2>
                            <p>Please refresh the page to try again.</p>
                        </div>
                    </div>
                `;
            }
        }

        function gameLoop() {
            perfMonitor.update();
            requestAnimationFrame(gameLoop);
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (game) {
                game.destroy();
            }
            perfMonitor.destroy();
        });
    </script>
</body>
</html>
