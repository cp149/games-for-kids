<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Drawing Studio - Phase 1</title>
    <meta name="description" content="A fun drawing and painting game for children aged 3-14+">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- Main Application Container -->
    <div class="app-container">
        <!-- Toolbar -->
        <aside class="toolbar">
            <!-- Tool Selector -->
            <section class="toolbar-section">
                <h3>🛠️ Tools</h3>
                <div id="tool-buttons" class="tool-buttons">
                    <!-- Dynamically populated -->
                </div>
            </section>

            <!-- Size Selector -->
            <section class="toolbar-section">
                <h3>📏 Size</h3>
                <div class="size-control">
                    <input type="range" id="size-slider" min="1" max="50" value="8" />
                    <span class="size-value" id="size-value">8px</span>
                </div>
            </section>

            <!-- Color Palette -->
            <section class="toolbar-section">
                <h3>🎨 Colors</h3>
                <div id="color-palette" class="color-palette">
                    <!-- Dynamically populated -->
                </div>
            </section>

            <!-- Symmetry Mode -->
            <section class="toolbar-section">
                <h3>🪞 Symmetry</h3>
                <div class="symmetry-buttons">
                    <button class="symmetry-btn" data-mode="horizontal" title="Left-Right Mirror">
                        ⬅️➡️
                    </button>
                    <button class="symmetry-btn" data-mode="vertical" title="Top-Bottom Mirror">
                        ⬆️⬇️
                    </button>
                </div>
            </section>

            <!-- Action Buttons -->
            <section class="toolbar-section">
                <div class="action-buttons">
                    <button id="template-btn" class="action-btn btn-template" title="Choose coloring template">
                        🎨 Template
                    </button>
                    <button id="save-btn" class="action-btn btn-save" title="Save your artwork">
                        💾 Save
                    </button>
                    <button id="gallery-btn" class="action-btn btn-gallery" title="View your artworks">
                        🖼️ Gallery
                    </button>
                    <button id="export-btn" class="action-btn btn-export" title="Download as PNG">
                        📥 Export
                    </button>
                    <button id="clear-btn" class="action-btn btn-clear" title="Clear canvas">
                        🗑️ Clear
                    </button>
                    <button id="music-btn" class="action-btn btn-music" title="Toggle background music">
                        🎵 Music ON
                    </button>
                </div>
            </section>
        </aside>

        <!-- Canvas Area -->
        <main class="canvas-container">
            <div class="canvas-wrapper">
                <canvas id="canvas" width="1000" height="700"></canvas>
                <div class="canvas-info">
                    ✨ Draw with mouse or touch! Use keyboard: B (brush), E (eraser)
                </div>
            </div>
        </main>
    </div>

    <!-- JavaScript Modules -->
    <script type="module" src="js/main.js?v=19"></script>
</body>
</html>
