<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Piano Factory - Musical Adventure for Kids</title>
    
    <!-- SEO and Social -->
    <meta name="description" content="A magical piano game for children to create beautiful music and learn musical basics through colorful, interactive piano keys with stunning visual effects.">
    <meta name="keywords" content="piano game, kids music, children piano, educational game, music learning">
    
    <!-- Mobile optimization -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Touch action for better mobile performance -->
    <meta name="touch-action" content="manipulation">
    
    <!-- Preload critical CSS -->
    <link rel="preload" href="css/main.css" as="style">
    <link rel="stylesheet" href="css/main.css">
    
    <!-- Favicon -->
    <link rel="icon" href="assets/icons/piano-icon.ico" type="image/x-icon">
</head>
<body>
    <div class="game-container">
        <!-- Header -->
        <header class="game-header">
            <div class="header-content">
                <h1 class="game-title">
                    🎹 <span class="title-text">Magic Piano Factory</span> ✨
                </h1>
                <div class="header-controls">
                    <button id="settings-btn" class="control-btn" title="Settings">
                        ⚙️
                    </button>
                    <button id="volume-btn" class="control-btn" title="Volume">
                        🔊
                    </button>
                    <button id="help-btn" class="control-btn" title="Help">
                        ❓
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="game-main">
            <!-- Control Panel -->
            <div class="control-panel">
                <div class="mode-selector">
                    <button id="free-play-btn" class="mode-btn" data-mode="free">
                        🎵 Free Play
                    </button>
                    <button id="songs-btn" class="mode-btn active" data-mode="songs">
                        🎶 Songs
                    </button>
                </div>
            </div>

            <!-- Song Selection (Visible by default since Songs mode is default) -->
            <div class="song-selector" id="song-selector" style="display: block;">
                <h3>🎵 Choose a Song to Learn</h3>
                
                <!-- Sheet Music Display -->
                <div class="sheet-music" id="sheet-music" style="display: none;">
                    <div class="sheet-header">
                        <h4 id="song-title-display">Song Title</h4>
                        <button id="close-sheet-btn" class="close-btn">✖️</button>
                    </div>
                    <div class="sheet-content">
                        <div class="learning-controls">
                            <div class="speed-control">
                                <label>⏱️ Learning Speed:</label>
                                <div class="speed-buttons">
                                    <button class="speed-btn" data-speed="slow">🐌 Slow</button>
                                    <button class="speed-btn active" data-speed="normal">🚶 Normal</button>
                                    <button class="speed-btn" data-speed="fast">🏃 Fast</button>
                                    <button class="speed-btn" data-speed="instant">⚡ Instant</button>
                                </div>
                            </div>
                            <div class="learning-mode">
                                <label>📚 Mode:</label>
                                <div class="mode-buttons">
                                    <button class="learning-mode-btn active" data-mode="guided">🎯 Guided</button>
                                    <button class="learning-mode-btn" data-mode="free">🎹 Free Practice</button>
                                </div>
                            </div>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progress-fill"></div>
                            <span class="progress-text" id="progress-text">0%</span>
                        </div>
                        <div class="note-sequence" id="note-sequence">
                            <!-- Notes will be populated here -->
                        </div>
                    </div>
                </div>
                
                <div class="song-grid">
                    <button class="song-card" data-song="twinkle">
                        <div class="song-title">⭐ Twinkle Little Star</div>
                        <div class="song-info">Range: C4-G4 | Easy</div>
                    </button>
                    <button class="song-card" data-song="birthday">
                        <div class="song-title">🎂 Happy Birthday</div>
                        <div class="song-info">Range: C4-C5 | Medium</div>
                    </button>
                    <button class="song-card" data-song="mary">
                        <div class="song-title">🐑 Mary Had a Little Lamb</div>
                        <div class="song-info">Range: C4-G4 | Easy</div>
                    </button>
                    <button class="song-card" data-song="row">
                        <div class="song-title">🚣 Row Your Boat</div>
                        <div class="song-info">Range: C4-C5 | Easy</div>
                    </button>
                </div>
            </div>

            <!-- Piano Keyboard -->
            <div class="piano-container" id="piano-container">
                <div class="piano-keyboard" id="piano-keyboard">
                    <!-- Piano keys will be generated by JavaScript -->
                </div>
            </div>

            <!-- Particle Effects Container -->
            <div class="effects-container" id="effects-container">
                <!-- Particle effects will be added here -->
            </div>
        </main>

        <!-- Footer Info -->
        <footer class="game-footer">
            <div class="current-mode" id="current-mode">
                Mode: Songs
            </div>
            <div class="instructions" id="instructions">
                🎵 Choose a song to learn and play along!
            </div>
        </footer>
    </div>

    <!-- Loading Screen -->
    <div class="loading-screen" id="loading-screen">
        <div class="loading-content">
            <h2>🎹 Loading Magic Piano Factory... ✨</h2>
            <div class="loading-bar">
                <div class="loading-progress" id="loading-progress"></div>
            </div>
            <p id="loading-text">Preparing musical magic...</p>
        </div>
    </div>

    <!-- JavaScript Modules -->
    <script type="module" src="js/main.js?v=2"></script>
</body>
</html>
