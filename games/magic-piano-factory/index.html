<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Piano Factory - Musical Adventure for Kids</title>
    
    <!-- SEO and Social -->
    <meta name="description" content="A magical piano game for children to create beautiful music and learn musical basics through colorful, interactive piano keys with stunning visual effects.">
    <meta name="keywords" content="piano game, kids music, children piano, educational game, music learning">
    
    <!-- Mobile optimization -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Touch action for better mobile performance -->
    <meta name="touch-action" content="manipulation">
    
    <!-- Preload critical CSS -->
    <link rel="preload" href="css/main.css" as="style">
    <link rel="stylesheet" href="css/main.css">
    
    <!-- Favicon -->
    <link rel="icon" href="assets/icons/piano-icon.ico" type="image/x-icon">
</head>
<body>
    <div class="game-container">
        <!-- Main Game Area -->
        <main class="game-main">
            <!-- Control Panel -->
            <div class="control-panel">
                <div class="mode-selector">
                    <button id="free-play-btn" class="mode-btn" data-mode="free">
                        🎵 Free Play
                    </button>
                    <button id="songs-btn" class="mode-btn active" data-mode="songs">
                        🎶 Songs
                    </button>
                    <div class="piano-mode-dropdown">
                        <button id="piano-mode-btn" class="mode-btn">
                            🎹 Play Mode ⯆
                        </button>
                        <div id="piano-mode-menu" class="piano-mode-menu">
                            <div class="mode-options">
                                <button class="piano-mode-option" data-mode="play">
                                    🎹 Play Mode
                                </button>
                                <button class="piano-mode-option" data-mode="scroll">
                                    🖱️ Scroll Mode
                                </button>
                            </div>
                            
                            <div class="octave-divider"></div>
                            
                            <div class="navigation-section">
                                <span class="section-label">Navigate:</span>
                                <div class="scroll-controls">
                                    <button id="scroll-left-btn" class="scroll-btn">⬅️ Left</button>
                                    <button id="scroll-right-btn" class="scroll-btn">Right ➡️</button>
                                </div>
                            </div>
                            
                            <div class="octave-divider"></div>
                            
                            <div class="octave-options">
                                <span class="octave-label">Quick Jump:</span>
                                <div class="octave-grid">
                                    <button class="octave-jump-btn" data-note="C1">C1</button>
                                    <button class="octave-jump-btn" data-note="C2">C2</button>
                                    <button class="octave-jump-btn" data-note="C3">C3</button>
                                    <button class="octave-jump-btn" data-note="C4">C4</button>
                                    <button class="octave-jump-btn" data-note="C5">C5</button>
                                    <button class="octave-jump-btn" data-note="C6">C6</button>
                                    <button class="octave-jump-btn" data-note="C7">C7</button>
                                </div>
                            </div>
                            
                            <div class="octave-divider"></div>
                            
                            <div class="current-position">
                                <span class="section-label">Current:</span>
                                <span id="popup-current-position">Middle C (C4)</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Song Selection (Visible by default since Songs mode is default) -->
            <div class="song-selector" id="song-selector" style="display: block;">
                <h3>🎵 Choose a Song to Learn</h3>
                
                <!-- Sheet Music Display (Compact) -->
                <div class="sheet-music" id="sheet-music" style="display: none;">
                    <div class="sheet-compact">
                        <div class="sheet-top-row">
                            <span id="song-title-display" class="compact-title">Song Title</span>
                            <div class="compact-controls">
                                <select class="compact-select" id="speed-select">
                                    <option value="slow">🐌 Slow</option>
                                    <option value="normal" selected>🚶 Normal</option>
                                    <option value="fast">🏃 Fast</option>
                                    <option value="instant">⚡ Instant</option>
                                </select>
                                <select class="compact-select" id="mode-select">
                                    <option value="guided" selected>🎯 Guided</option>
                                    <option value="free">🎹 Free Practice</option>
                                </select>
                                <button id="close-sheet-btn" class="compact-close">✖️</button>
                            </div>
                        </div>
                        <div class="compact-progress">
                            <div class="progress-fill" id="progress-fill"></div>
                            <span class="progress-text" id="progress-text">0%</span>
                        </div>
                        <div class="note-sequence-compact" id="note-sequence">
                            <!-- Notes will be populated here -->
                        </div>
                    </div>
                </div>
                
                <div class="level-selector">
                    <button class="level-btn beginner" data-level="beginner">
                        🟢 Beginner
                        <span class="level-count">3 songs</span>
                    </button>
                    <button class="level-btn easy" data-level="easy">
                        🟡 Easy
                        <span class="level-count">7 songs</span>
                    </button>
                    <button class="level-btn medium" data-level="medium">
                        🟠 Medium
                        <span class="level-count">4 songs</span>
                    </button>
                    <button class="level-btn hard" data-level="hard">
                        🔴 Hard
                        <span class="level-count">4 songs</span>
                    </button>
                </div>

                <!-- Song Selection Popup -->
                <div id="song-popup" class="song-popup" style="display: none;">
                    <div class="song-popup-content">
                        <div class="popup-header">
                            <h3 id="popup-level-title">Select a Song</h3>
                            <button id="close-song-popup" class="popup-close">✖️</button>
                        </div>
                        <div class="popup-songs" id="popup-songs">
                            <!-- Songs will be populated here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Piano Keyboard -->
            <div class="piano-container" id="piano-container">
                <div class="piano-keyboard" id="piano-keyboard">
                    <!-- Piano keys will be generated by JavaScript -->
                </div>
            </div>

            <!-- Particle Effects Container -->
            <div class="effects-container" id="effects-container">
                <!-- Particle effects will be added here -->
            </div>
        </main>

        <!-- Footer Info -->
        <footer class="game-footer">
            <div class="current-mode" id="current-mode">
                Mode: Songs
            </div>
            <div class="instructions" id="instructions">
                🎵 Choose a song to learn and play along!
            </div>
        </footer>
    </div>

    <!-- Loading Screen -->
    <div class="loading-screen" id="loading-screen">
        <div class="loading-content">
            <h2>🎹 Loading Magic Piano Factory... ✨</h2>
            <div class="loading-bar">
                <div class="loading-progress" id="loading-progress"></div>
            </div>
            <p id="loading-text">Preparing musical magic...</p>
        </div>
    </div>

    <!-- JavaScript Modules -->
    <script type="module" src="js/main.js?v=2"></script>
</body>
</html>
