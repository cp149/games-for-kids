<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, maximum-scale=1.0">
    <meta name="description" content="A colorful match-3 puzzle game for children aged 6-10">
    <meta name="theme-color" content="#FF6B6B">

    <!-- iOS Safari specific -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Match Three">

    <!-- PWA manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.svg">

    <!-- Content Security Policy for enhanced security -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   style-src 'self' https://fonts.googleapis.com;
                   font-src 'self' https://fonts.gstatic.com;
                   img-src 'self' data:;
                   media-src 'self';
                   script-src 'self';">

    <title>Match Three - Fun Puzzle Game</title>

    <!-- Styles (includes overscroll-behavior for mobile) -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Game container - UI created by UIManager -->
    <div id="game-container"></div>

    <!-- Load scripts in correct order -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/board-logic.js"></script>
    <script src="js/classes/GameContext.js"></script>
    <script src="js/classes/Gem.js"></script>
    <script src="js/classes/Board.js"></script>
    <script src="../lib/particle-system.js"></script>
    <script src="js/managers/EffectsManager.js"></script>
    <script src="js/managers/ModalManager.js"></script>
    <script src="js/managers/UIManager.js"></script>
    <script src="js/managers/MusicManager.js"></script>
    <script src="js/managers/SoundManager.js"></script>
    <script src="js/managers/ScoreManager.js"></script>
    <script src="js/classes/MatchThreeGame.js"></script>

    <!-- Initialize game -->
    <script src="js/init.js"></script>
</body>
</html>
