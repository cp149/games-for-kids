<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Factory - Create Your Own Music</title>
  <meta name="description" content="Music Factory - A fun music creation game for kids. Build songs by dragging and dropping musical blocks!">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Start Screen -->
  <div id="start-screen">
    <h1>🎵 Music Factory</h1>
    <p>Build Your Own Music, One Block at a Time!</p>
    <button id="start-btn" class="btn btn-primary">Start Creating</button>
  </div>

  <!-- Loading Screen -->
  <div id="loading">
    <div class="loading-spinner"></div>
    <p style="margin-top: 1rem;">Loading audio files...</p>
  </div>

  <!-- Main App -->
  <div id="app" style="display: none;">
    <!-- Header -->
    <header class="header">
      <h1>🎵 Music Factory</h1>
      <div class="controls">
        <button id="play-btn" class="btn btn-primary">▶ Play</button>
        <button id="stop-btn" class="btn btn-secondary">⏹ Stop</button>
        <button id="clear-btn" class="btn btn-danger">🗑 Clear</button>
        <button id="save-btn" class="btn btn-secondary">💾 Save</button>
        <button id="load-btn" class="btn btn-secondary">📂 Load</button>
      </div>
    </header>

    <!-- Main Container -->
    <div class="container">
      <!-- Block Library -->
      <aside class="block-library">
        <h2>Music Blocks</h2>
        <div id="block-library">
          <!-- Blocks will be rendered here by JavaScript -->
        </div>
      </aside>

      <!-- Timeline -->
      <main class="timeline-container">
        <!-- Audio Visualizers -->
        <div class="visualizers">
          <div class="visualizer-track">
            <span class="visualizer-label">🥁</span>
            <div class="visualizer-bar">
              <div class="track-visualizer" data-track="drums"></div>
            </div>
          </div>
          <div class="visualizer-track">
            <span class="visualizer-label">🎸</span>
            <div class="visualizer-bar">
              <div class="track-visualizer" data-track="bass"></div>
            </div>
          </div>
          <div class="visualizer-track">
            <span class="visualizer-label">🎹</span>
            <div class="visualizer-bar">
              <div class="track-visualizer" data-track="melody"></div>
            </div>
          </div>
          <div class="visualizer-track">
            <span class="visualizer-label">✨</span>
            <div class="visualizer-bar">
              <div class="track-visualizer" data-track="fx"></div>
            </div>
          </div>
        </div>

        <div id="timeline">
          <!-- Timeline will be rendered here by JavaScript -->
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
          <div class="control-group">
            <input type="checkbox" id="loop-toggle">
            <label for="loop-toggle">Loop</label>
          </div>

          <div class="control-group">
            <label for="volume-slider">Volume:</label>
            <input type="range" id="volume-slider" min="0" max="100" value="70">
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Message Popups -->
  <div id="message"></div>
  <div id="error-message"></div>

  <!-- Scripts -->
  <script type="module" src="js/main.js"></script>

  <script>
    // Show app once started
    document.getElementById('start-btn').addEventListener('click', () => {
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
    });
  </script>
</body>
</html>
