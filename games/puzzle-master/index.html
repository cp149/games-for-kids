<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧩 Puzzle Master - Fun Puzzle Game for Kids</title>
    <meta name="description" content="Create and solve puzzles from your own images! Load photos, adjust difficulty, and have fun!">

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="game-container"></div>

    <!-- Load config first, then managers, then classes in order -->
    <script src="js/config.js"></script>
    <script src="js/managers/UIManager.js"></script>
    <script src="js/managers/MusicManager.js"></script>
    <script src="js/managers/TimerManager.js"></script>
    <script src="js/classes/PuzzlePiece.js"></script>
    <script src="js/classes/PuzzleBoard.js"></script>
    <script src="js/classes/ImageLoader.js"></script>
    <script src="js/classes/PuzzleGame.js"></script>

    <!-- Initialize game -->
    <script>
        // Wait for DOM to be ready
        document.addEventListener('DOMContentLoaded', () => {
            // Create game instance
            const game = new PuzzleGame('game-container');

            // Bind keyboard handler for potential cleanup
            game.handleKeydown = (e) => {
                // Press 'H' for hint
                if (e.key === 'h' || e.key === 'H') {
                    if (game.puzzleBoard) {
                        game.puzzleBoard.showHint();
                    }
                }

                // Press 'R' to shuffle/reset
                if (e.key === 'r' || e.key === 'R') {
                    if (game.puzzleBoard) {
                        game.puzzleBoard.reset();
                        game.resetStats();
                    }
                }

                // Press Space to toggle reference
                if (e.key === ' ') {
                    e.preventDefault();
                    document.getElementById('toggle-reference').click();
                }
            };
            document.addEventListener('keydown', game.handleKeydown);

            // Bind visibility change handler for potential cleanup
            game.handleVisibilityChange = () => {
                if (document.hidden) {
                    if (game.timerManager.isRunning()) {
                        game.stopTimer(true);  // Save elapsed time
                        game.timerManager.wasPaused = true;
                    }
                } else if (!document.hidden && game.timerManager.wasPaused) {
                    // Resume timer if puzzle is not complete
                    if (game.puzzleBoard && game.puzzleBoard.piecesPlaced < game.puzzleBoard.pieces.length) {
                        game.startTimer(true);  // Resume from saved time
                    }
                    game.timerManager.wasPaused = false;
                }
            };
            document.addEventListener('visibilitychange', game.handleVisibilityChange);

            // Cleanup on page unload
            window.addEventListener('beforeunload', () => {
                game.destroy();
            });
        });
    </script>
</body>
</html>
