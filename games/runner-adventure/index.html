<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runner Adventure - Prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Arial', sans-serif;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw !important;
            height: 100vh !important;
        }
    </style>
</head>
<body>

    <script type="module">
        // Import KAPLAY from CDN
        import kaplay from "https://unpkg.com/kaplay@3001.0.0/dist/kaplay.mjs";

        // Initialize KAPLAY - defaults to fullscreen
        const k = kaplay({
            background: [135, 206, 235], // Sky blue
            gravity: 2400  // Increased gravity
        });

        // Load assets
        k.loadSprite("player-run", "assets/images/player-run.png", {
            sliceX: 8,  // 8 frames horizontally
            anims: {
                run: { from: 0, to: 7, loop: true, speed: 10 }  // Loop through all 8 frames
            }
        });
        k.loadSprite("obstacle", "assets/images/obstacle.png");
        k.loadSprite("coin", "assets/images/coin.png");
        k.loadSprite("background", "assets/images/background.png");
        k.loadSprite("ground-deco", "assets/images/deco.png", {
            sliceX: 4,  // 4 columns
            sliceY: 2   // 2 rows = 8 decorations total
        });
        k.loadSprite("mountains-range", "assets/images/mountains-range.png");
        k.loadSprite("cloud", "assets/images/cloud.png");
        k.loadSprite("cloud2", "assets/images/cloud2.png");

        // Load background music
        k.loadSound("bgMusic", "assets/sounds/background-music.mp3");

        // Generate simple sound effects with Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playJumpSound() {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);

            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.1);
        }

        function playCoinSound() {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);

            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.1);
        }

        function playGameOverSound() {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.4);

            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.4);
        }

        function playComboUpSound(level) {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            // Higher pitch for higher combo levels
            const basePitch = 600 + (level * 200);
            oscillator.frequency.setValueAtTime(basePitch, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(basePitch * 1.5, audioCtx.currentTime + 0.2);

            gainNode.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.2);
        }

        // Wait for KAPLAY to be ready
        k.onLoad(() => {
            console.log("Canvas size:", k.width(), k.height());
        });

        // Constants
        const GRAVITY = 1200;  // Gravity acceleration
        const JUMP_FORCE = 500;  // Jump force
        const GROUND_Y = 500;  // Fixed ground position
        const PLAYER_SPEED = 300;
        const OBSTACLE_SPEED = 300;
        const SPAWN_INTERVAL = 1.5;

        // Game state
        let score = 0;
        let gameSpeed = 1;
        let highScore = parseInt(localStorage.getItem('runnerHighScore') || '0');

        // Colors (for fallback)
        const COLORS = {
            player: [255, 200, 50],    // Yellow
            obstacle: [220, 50, 50],   // Red
            ground: [100, 200, 100],   // Green
            coin: [255, 215, 0]        // Gold
        };

        // Wait for assets to load
        k.onLoad(() => {
            console.log("All assets loaded!");
        });

        // ===== GROUND DECORATOR CLASS =====
        class GroundDecorator {
            constructor(k, groundY, speed) {
                this.k = k;
                this.groundY = groundY;
                this.speed = speed;

                // Frame configurations: [frameIndex, yOffset, minScale, maxScale]
                // Using anchor("center") like obstacle (groundY - 20)
                // Negative offset moves up from groundY (above ground)
                // Positive offset moves down (will be blocked by ground rectangle)
                this.decoConfigs = [
                    { frame: 0, offset: -11, name: 'grass' },       // grass (row 1)
                    { frame: 3, offset: -11, name: 'bush' },        // bush (row 1)
                    { frame: 4, offset: -7, name: 'pebble' },       // pebble (row 2) - perfect
                    { frame: 5, offset: -15, name: 'mushroom' }     // mushroom (row 2) - perfect
                ];

                this.spawnInterval = 0.5; // seconds
                this.minScale = 0.13;
                this.maxScale = 0.19;
            }

            spawn() {
                const config = this.k.choose(this.decoConfigs);
                const scale = this.k.rand(this.minScale, this.maxScale);
                // Use same anchor as obstacle for consistency
                const yOffset = config.offset;

                this.k.add([
                    this.k.sprite("ground-deco", { frame: config.frame }),
                    this.k.pos(this.k.width(), this.groundY + yOffset),
                    this.k.scale(scale),
                    this.k.anchor("center"),  // Same as obstacle
                    this.k.move(this.k.LEFT, this.speed),
                    this.k.offscreen({ destroy: true }),
                    this.k.z(-1),
                    `ground-deco-${config.name}`
                ]);
            }

            startSpawning() {
                return this.k.loop(this.spawnInterval, () => {
                    this.spawn();
                });
            }
        }

        // ===== GAME SCENE =====
        k.scene("game", () => {
            score = 0;
            gameSpeed = 1;
            let combo = 0;
            let comboTimer = 0;
            const COMBO_TIMEOUT = 3; // seconds

            // Combo multiplier calculation
            function getComboMultiplier(comboCount) {
                if (comboCount < 5) return 1;
                if (comboCount < 10) return 1.5;
                if (comboCount < 20) return 2;
                return 3;
            }

            // Combo color based on level
            function getComboColor(comboCount) {
                if (comboCount < 5) return [255, 255, 255]; // white
                if (comboCount < 10) return [255, 255, 0]; // yellow
                if (comboCount < 20) return [255, 165, 0]; // orange
                return [255, 0, 0]; // red
            }

            // Play background music (loop)
            const music = k.play("bgMusic", {
                loop: true,
                volume: 0.5
            });

            // Dynamic ground position - at bottom of screen
            const groundY = k.height() - 100;

            // Debug: show screen info
            console.log("Screen:", k.width(), "x", k.height());
            console.log("Ground Y:", groundY);
            console.log("Player Y:", groundY - 45);

            // Add fullscreen background
            const background = k.add([
                k.rect(k.width(), k.height()),
                k.pos(0, 0),
                k.color(135, 206, 235),
                k.z(-10),
                {
                    baseColor: [135, 206, 235],
                    targetColor: [135, 206, 235]
                }
            ]);

            // Add ground
            const ground = k.add([
                k.rect(k.width(), 100),
                k.pos(0, groundY),
                k.area(),
                k.body({ isStatic: true }),
                k.color(COLORS.ground),
                "ground"
            ]);

            // Add player (using animated sprite)
            const player = k.add([
                k.sprite("player-run"),
                k.pos(100, groundY - 25),
                k.area({ scale: 0.15 }),  // Much tighter collision box
                k.scale(0.35),  // Larger size
                k.anchor("center"),
                "player",
                {
                    velocityY: 0,
                    isJumping: false
                }
            ]);

            // Play running animation
            player.play("run");

            // Manual gravity and physics
            let wasInAir = false;
            let trailTimer = 0;
            player.onUpdate(() => {
                // Apply gravity
                player.velocityY += GRAVITY * k.dt();
                player.pos.y += player.velocityY * k.dt();

                // Ground collision check
                if (player.pos.y >= groundY - 25) {
                    player.pos.y = groundY - 25;

                    // Landing dust effect
                    if (wasInAir) {
                        for (let i = 0; i < 6; i++) {
                            k.add([
                                k.circle(k.rand(2, 5)),
                                k.pos(player.pos.x + k.rand(-15, 15), groundY),
                                k.color(200, 180, 150),
                                k.opacity(0.6),
                                k.lifespan(0.3),
                                k.move(k.rand(0, 360), k.rand(50, 100)),
                                k.z(5)
                            ]);
                        }
                    }

                    player.velocityY = 0;
                    player.isJumping = false;
                    wasInAir = false;
                } else {
                    wasInAir = true;
                }

                // Trail effect when combo is active
                if (combo >= 5) {
                    trailTimer += k.dt();
                    if (trailTimer >= 0.05) { // Spawn trail every 0.05 seconds
                        trailTimer = 0;
                        const color = getComboColor(combo);
                        const trailIntensity = Math.min(combo / 20, 1); // Max at 20 combo

                        k.add([
                            k.sprite("player-run", { frame: player.frame }),
                            k.pos(player.pos),
                            k.scale(player.scale),
                            k.anchor("center"),
                            k.color(color[0], color[1], color[2]),
                            k.opacity(0.3 * trailIntensity),
                            k.lifespan(0.2),
                            k.z(-1)
                        ]);
                    }
                }
            });

            // UI Background panels
            k.add([
                k.rect(280, 120, { radius: 8 }),
                k.pos(20, 20),
                k.color(0, 0, 0),
                k.opacity(0.5),
                k.z(99)
            ]);

            // Score text
            const scoreText = k.add([
                k.text(`Score: ${score}`, { size: 28 }),
                k.pos(35, 30),
                k.color(255, 255, 255),
                k.z(100)
            ]);

            // High score text
            const highScoreText = k.add([
                k.text(`Best: ${highScore}`, { size: 22 }),
                k.pos(35, 65),
                k.color(255, 215, 0),
                k.z(100)
            ]);

            // Speed indicator
            const speedText = k.add([
                k.text(`Speed: ${gameSpeed.toFixed(1)}x`, { size: 20 }),
                k.pos(35, 100),
                k.color(150, 255, 150),
                k.z(100)
            ]);

            // Combo display
            const comboText = k.add([
                k.text("", { size: 32 }),
                k.pos(k.width() / 2, 80),
                k.anchor("center"),
                k.color(255, 255, 255),
                k.z(100),
                k.opacity(0),
                k.scale(1),
                {
                    pulseTime: 0
                }
            ]);

            // Combo timer bar (progress bar)
            const comboBarBg = k.add([
                k.rect(300, 8),
                k.pos(k.width() / 2, 115),
                k.anchor("center"),
                k.color(50, 50, 50),
                k.z(100),
                k.opacity(0)
            ]);

            const comboBar = k.add([
                k.rect(300, 8),
                k.pos(k.width() / 2, 115),
                k.anchor("center"),
                k.color(255, 255, 0),
                k.z(101),
                k.opacity(0)
            ]);

            // Pause overlay (initially hidden)
            const pauseOverlay = k.add([
                k.rect(k.width(), k.height()),
                k.pos(0, 0),
                k.color(0, 0, 0),
                k.opacity(0),
                k.z(200)
            ]);

            const pauseText = k.add([
                k.text("PAUSED", { size: 64 }),
                k.pos(k.width() / 2, k.height() / 2 - 50),
                k.anchor("center"),
                k.color(255, 255, 255),
                k.opacity(0),
                k.z(201)
            ]);

            const pauseHint = k.add([
                k.text("Press ENTER or Right Click to Resume", { size: 24 }),
                k.pos(k.width() / 2, k.height() / 2 + 30),
                k.anchor("center"),
                k.color(200, 200, 200),
                k.opacity(0),
                k.z(201)
            ]);

            // Pause/Resume function
            function togglePause() {
                k.debug.paused = !k.debug.paused;

                if (k.debug.paused) {
                    // Show pause overlay
                    music.pause();
                    pauseOverlay.opacity = 0.7;
                    pauseText.opacity = 1;
                    pauseHint.opacity = 1;
                } else {
                    // Hide pause overlay
                    music.play();
                    pauseOverlay.opacity = 0;
                    pauseText.opacity = 0;
                    pauseHint.opacity = 0;
                }
            }

            // Pause controls
            k.onKeyPress("enter", togglePause);

            // Right click to pause
            document.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                togglePause();
            });

            // Jump controls
            k.onKeyPress("space", () => {
                if (!k.debug.paused && !player.isJumping) {
                    player.velocityY = -JUMP_FORCE;
                    player.isJumping = true;
                    playJumpSound();
                }
            });

            k.onClick(() => {
                if (!k.debug.paused && !player.isJumping) {
                    player.velocityY = -JUMP_FORCE;
                    player.isJumping = true;
                    playJumpSound();
                }
            });

            k.onTouchStart(() => {
                if (!k.debug.paused && !player.isJumping) {
                    player.velocityY = -JUMP_FORCE;
                    player.isJumping = true;
                    playJumpSound();
                }
            });

            // Spawn obstacles
            k.loop(SPAWN_INTERVAL, () => {
                const obstacle = k.add([
                    k.sprite("obstacle"),
                    k.pos(k.width(), groundY - 20),
                    k.area({ scale: 0.6 }),  // Smaller collision box
                    k.scale(0.08),  // Much smaller
                    k.anchor("center"),
                    k.move(k.LEFT, OBSTACLE_SPEED * gameSpeed),
                    k.offscreen({ destroy: true }),
                    "obstacle"
                ]);
            });

            // Spawn coins (optional collectibles)
            k.loop(SPAWN_INTERVAL * 2, () => {
                const yPos = k.rand(groundY - 180, groundY - 80);
                const coin = k.add([
                    k.sprite("coin"),
                    k.pos(k.width(), yPos),
                    k.area({ scale: 0.8 }),  // Slightly smaller collision for easier collection
                    k.scale(0.05),  // Smaller coin
                    k.anchor("center"),
                    k.move(k.LEFT, OBSTACLE_SPEED * gameSpeed),
                    k.offscreen({ destroy: true }),
                    "coin"  // Make sure it's tagged as coin, not obstacle
                ]);
            });

            // Update score
            k.onUpdate(() => {
                score += k.dt() * 10 * gameSpeed;
                scoreText.text = `Score: ${Math.floor(score)}`;

                // Update high score
                if (Math.floor(score) > highScore) {
                    highScore = Math.floor(score);
                    highScoreText.text = `Best: ${highScore}`;
                    localStorage.setItem('runnerHighScore', highScore.toString());
                }

                // Gradually increase speed with max cap at 3.5x (slower progression)
                gameSpeed = Math.min(3.5, 1 + Math.floor(score / 200) * 0.1);
                speedText.text = `Speed: ${gameSpeed.toFixed(1)}x`;

                // Update combo timer
                if (combo > 0) {
                    comboTimer += k.dt();

                    // Check timeout
                    if (comboTimer >= COMBO_TIMEOUT) {
                        combo = 0;
                        comboTimer = 0;
                        comboText.opacity = 0;
                        comboBarBg.opacity = 0;
                        comboBar.opacity = 0;
                        background.targetColor = [135, 206, 235]; // Reset to sky blue
                    } else {
                        // Show combo display
                        const multiplier = getComboMultiplier(combo);
                        comboText.text = `${combo} COMBO x${multiplier.toFixed(1)}`;
                        const color = getComboColor(combo);
                        comboText.color = k.rgb(color[0], color[1], color[2]);
                        comboText.opacity = 1;

                        // Pulse animation
                        comboText.pulseTime += k.dt() * 5;
                        const pulseScale = 1 + Math.sin(comboText.pulseTime) * 0.15;
                        comboText.scale = k.vec2(pulseScale, pulseScale);

                        // Update progress bar
                        const timeLeft = COMBO_TIMEOUT - comboTimer;
                        const progress = timeLeft / COMBO_TIMEOUT;
                        comboBar.width = 300 * progress;
                        comboBar.color = k.rgb(color[0], color[1], color[2]);
                        comboBarBg.opacity = 0.5;
                        comboBar.opacity = 0.8;

                        // Change background tint based on combo level
                        if (combo >= 20) {
                            background.targetColor = [155, 180, 255]; // Intense blue-purple
                        } else if (combo >= 10) {
                            background.targetColor = [145, 200, 245]; // Light purple-blue
                        } else if (combo >= 5) {
                            background.targetColor = [140, 210, 240]; // Slightly tinted
                        }
                    }
                } else {
                    comboText.opacity = 0;
                    comboBarBg.opacity = 0;
                    comboBar.opacity = 0;
                    background.targetColor = [135, 206, 235]; // Sky blue
                }

                // Smoothly transition background color
                background.baseColor[0] += (background.targetColor[0] - background.baseColor[0]) * k.dt() * 2;
                background.baseColor[1] += (background.targetColor[1] - background.baseColor[1]) * k.dt() * 2;
                background.baseColor[2] += (background.targetColor[2] - background.baseColor[2]) * k.dt() * 2;
                background.color = k.rgb(background.baseColor[0], background.baseColor[1], background.baseColor[2]);

                // Note: New obstacles will spawn at current gameSpeed
                // Existing obstacles keep their spawn speed (simpler and avoids errors)
            });

            // Collision with obstacles - Game Over
            player.onCollide("obstacle", () => {
                playGameOverSound();
                music.stop();
                k.go("gameover", Math.floor(score));
            });

            // Collect coins
            player.onCollide("coin", (coin) => {
                k.destroy(coin);

                // Check combo level before increment
                const oldLevel = Math.floor((combo) / 5);

                // Update combo
                combo++;
                comboTimer = 0; // Reset timer

                // Check if combo level increased
                const newLevel = Math.floor((combo) / 5);
                if (newLevel > oldLevel && combo >= 5) {
                    playComboUpSound(newLevel);

                    // Burst effect at combo text position
                    for (let i = 0; i < 15; i++) {
                        const angle = k.rand(0, 360);
                        const speed = k.rand(150, 300);
                        const color = getComboColor(combo);

                        k.add([
                            k.rect(8, 8),
                            k.pos(k.width() / 2, 80),
                            k.color(color[0], color[1], color[2]),
                            k.opacity(1),
                            k.anchor("center"),
                            k.lifespan(0.5),
                            k.move(angle, speed),
                            k.z(99)
                        ]);
                    }

                    // Screen flash effect
                    const flash = k.add([
                        k.rect(k.width(), k.height()),
                        k.pos(0, 0),
                        k.color(color[0], color[1], color[2]),
                        k.opacity(0.3),
                        k.z(98)
                    ]);
                    k.wait(0.1, () => k.destroy(flash));
                }

                // Calculate score with multiplier
                const multiplier = getComboMultiplier(combo);
                const coinScore = Math.floor(50 * multiplier);
                score += coinScore;

                playCoinSound();

                // Show score popup at coin position
                const scorePopup = k.add([
                    k.text(`+${coinScore}`, { size: 24 }),
                    k.pos(coin.pos),
                    k.anchor("center"),
                    k.color(getComboColor(combo)),
                    k.opacity(1),
                    k.lifespan(1),
                    k.z(102),
                    {
                        vel: k.vec2(0, -100)
                    }
                ]);

                // Animate score popup
                scorePopup.onUpdate(() => {
                    scorePopup.pos = scorePopup.pos.add(scorePopup.vel.scale(k.dt()));
                    scorePopup.opacity -= k.dt();
                });
                // Simple particle effect with coin sprites (no area - won't collide)
                for (let i = 0; i < 8; i++) {
                    k.add([
                        k.sprite("coin"),
                        k.pos(coin.pos),
                        k.scale(0.03),
                        k.opacity(1),
                        k.lifespan(0.3),
                        k.move(k.rand(0, 360), k.rand(100, 200)),
                        k.z(10)  // Above everything
                        // NOTE: No k.area() so particles won't trigger collisions
                    ]);
                }
            });

            // Ground decoration using GroundDecorator class
            const groundDecorator = new GroundDecorator(k, groundY, OBSTACLE_SPEED * gameSpeed);
            groundDecorator.startSpawning();

            // Falling flowers (decorative effect)
            k.loop(2, () => {
                const xPos = k.rand(0, k.width());
                const flowerFrame = k.choose([1, 2, 6]); // yellow flower, pink flower, daisy
                const scale = k.rand(0.08, 0.12);
                const fallSpeed = k.rand(30, 60);
                const sideSpeed = k.rand(-20, 20);

                k.add([
                    k.sprite("ground-deco", { frame: flowerFrame }),
                    k.pos(xPos, k.rand(-50, 100)),
                    k.scale(scale),
                    k.anchor("center"),
                    k.rotate(k.rand(0, 360)),
                    k.opacity(0.8),
                    k.offscreen({ destroy: true }),
                    k.z(-2),
                    {
                        swayTime: 0,
                        swaySpeed: k.rand(2, 4),
                        swayAmount: k.rand(20, 40)
                    }
                ]);
            });

            // Update falling flowers with swaying motion
            k.onUpdate(() => {
                k.get("*").forEach(obj => {
                    if (obj.swayTime !== undefined) {
                        obj.swayTime += k.dt();
                        // Sway left and right
                        obj.pos.x += Math.sin(obj.swayTime * obj.swaySpeed) * obj.swayAmount * k.dt();
                        // Fall down
                        obj.pos.y += 40 * k.dt();
                        // Gentle rotation
                        obj.angle += 30 * k.dt();

                        // Destroy if fallen past ground
                        if (obj.pos.y > groundY + 100) {
                            k.destroy(obj);
                        }
                    }
                });
            });

            // Parallax background - continuous mountain range
            k.loop(8, () => {
                k.add([
                    k.sprite("mountains-range"),
                    k.pos(k.width(), groundY),
                    k.scale(k.rand(0.3, 0.5)),
                    k.anchor("bot"),
                    k.opacity(0.4),
                    k.move(k.LEFT, 30),  // Slower parallax
                    k.offscreen({ destroy: true }),
                    k.z(-5)
                ]);
            });

            // Clouds in background (multiple layers, varied)
            k.loop(4, () => {
                const cloudType = k.choose(["cloud", "cloud2"]);
                k.add([
                    k.sprite(cloudType),
                    k.pos(k.width(), k.rand(50, 250)),
                    k.scale(k.rand(0.15, 0.3)),  // Even smaller clouds
                    k.opacity(0.7),
                    k.move(k.LEFT, 40),  // Medium speed
                    k.offscreen({ destroy: true }),
                    k.z(-3)
                ]);
            });

            // Closer clouds (varied)
            k.loop(6, () => {
                const cloudType = k.choose(["cloud", "cloud2"]);
                k.add([
                    k.sprite(cloudType),
                    k.pos(k.width(), k.rand(80, 300)),
                    k.scale(k.rand(0.2, 0.4)),  // Even smaller clouds
                    k.opacity(0.5),
                    k.move(k.LEFT, 60),  // Faster
                    k.offscreen({ destroy: true }),
                    k.z(-2)
                ]);
            });

            // Sun decoration
            k.add([
                k.circle(50),
                k.pos(k.width() - 100, 100),
                k.color(255, 220, 100),
                k.opacity(0.8),
                k.z(-10)
            ]);
        });

        // ===== GAME OVER SCENE =====
        k.scene("gameover", (finalScore) => {
            // Semi-transparent overlay
            k.add([
                k.rect(k.width(), k.height()),
                k.color(0, 0, 0),
                k.opacity(0.7)
            ]);

            // Game Over panel
            k.add([
                k.rect(500, 400, { radius: 16 }),
                k.pos(k.width() / 2, k.height() / 2),
                k.anchor("center"),
                k.color(40, 40, 60),
                k.opacity(0.95),
                k.z(1)
            ]);

            // Title
            k.add([
                k.text("Game Over!", { size: 56 }),
                k.pos(k.width() / 2, k.height() / 2 - 130),
                k.anchor("center"),
                k.color(255, 100, 100),
                k.z(2)
            ]);

            // Score section
            k.add([
                k.text("Score", { size: 24 }),
                k.pos(k.width() / 2, k.height() / 2 - 50),
                k.anchor("center"),
                k.color(200, 200, 200),
                k.z(2)
            ]);

            k.add([
                k.text(`${finalScore}`, { size: 48 }),
                k.pos(k.width() / 2, k.height() / 2 - 10),
                k.anchor("center"),
                k.color(255, 255, 255),
                k.z(2)
            ]);

            // High score indicator
            const isNewRecord = finalScore >= highScore;
            if (isNewRecord) {
                k.add([
                    k.text("🏆 NEW RECORD! 🏆", { size: 28 }),
                    k.pos(k.width() / 2, k.height() / 2 + 45),
                    k.anchor("center"),
                    k.color(255, 215, 0),
                    k.z(2)
                ]);
            } else {
                k.add([
                    k.text(`Best: ${highScore}`, { size: 24 }),
                    k.pos(k.width() / 2, k.height() / 2 + 45),
                    k.anchor("center"),
                    k.color(255, 215, 0),
                    k.z(2)
                ]);
            }

            // Restart button background
            const restartBtn = k.add([
                k.rect(300, 60, { radius: 8 }),
                k.pos(k.width() / 2, k.height() / 2 + 130),
                k.anchor("center"),
                k.color(100, 200, 100),
                k.area(),
                k.z(2),
                "restart-btn"
            ]);

            // Restart button text
            k.add([
                k.text("RESTART", { size: 28 }),
                k.pos(k.width() / 2, k.height() / 2 + 130),
                k.anchor("center"),
                k.color(255, 255, 255),
                k.z(3)
            ]);

            // Button hover effect
            restartBtn.onHover(() => {
                restartBtn.color = k.rgb(120, 220, 120);
            });

            restartBtn.onHoverEnd(() => {
                restartBtn.color = k.rgb(100, 200, 100);
            });

            // Restart controls
            function restart() {
                k.go("game");
            }

            restartBtn.onClick(restart);
            k.onKeyPress("space", restart);
            k.onKeyPress("r", restart);
            k.onTouchStart(restart);
        });

        // ===== MENU SCENE =====
        k.scene("menu", () => {
            // Background - cover entire screen (may crop edges)
            const bgScale = Math.max(k.width() / 512, k.height() / 512);
            k.add([
                k.sprite("background"),
                k.pos(k.width() / 2, k.height() / 2),
                k.anchor("center"),
                k.scale(bgScale),
                k.z(-10)
            ]);

            k.add([
                k.text("Runner Adventure", { size: 56 }),
                k.pos(k.width() / 2, k.height() / 2 - 100),
                k.anchor("center"),
                k.color(255, 255, 255)
            ]);

            const startBtn = k.add([
                k.rect(200, 60, { radius: 8 }),
                k.pos(k.width() / 2, k.height() / 2 + 60),
                k.anchor("center"),
                k.color(100, 200, 100),
                k.area(),
                k.opacity(0.9),
                "button"
            ]);

            k.add([
                k.text("Start Game", { size: 24 }),
                k.pos(k.width() / 2, k.height() / 2 + 60),
                k.anchor("center"),
                k.color(255, 255, 255)
            ]);

            // Button hover effect
            startBtn.onHover(() => {
                startBtn.color = k.rgb(120, 220, 120);
            });

            startBtn.onHoverEnd(() => {
                startBtn.color = k.rgb(100, 200, 100);
            });

            // Start game
            startBtn.onClick(() => {
                k.go("game");
            });

            k.onKeyPress("space", () => {
                k.go("game");
            });

            // Instructions - Background panel for contrast
            k.add([
                k.rect(700, 150, { radius: 12 }),
                k.pos(k.width() / 2, k.height() - 140),
                k.anchor("center"),
                k.color(0, 0, 0),
                k.opacity(0.7),
                k.z(1)
            ]);

            // Instructions text
            k.add([
                k.text("🎮 Controls", { size: 28 }),
                k.pos(k.width() / 2, k.height() - 180),
                k.anchor("center"),
                k.color(255, 255, 255),
                k.z(2)
            ]);

            k.add([
                k.text("SPACE / Click / Tap to Jump", { size: 22 }),
                k.pos(k.width() / 2, k.height() - 140),
                k.anchor("center"),
                k.color(255, 255, 255),
                k.z(2)
            ]);

            k.add([
                k.text("Avoid obstacles 🌵 • Collect coins 💰", { size: 20 }),
                k.pos(k.width() / 2, k.height() - 100),
                k.anchor("center"),
                k.color(255, 255, 255),
                k.z(2)
            ]);
        });

        // Start with menu
        k.go("menu");
    </script>
</body>
</html>
