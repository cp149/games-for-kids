            k.add([
                k.rect(630, 250, { radius: 20 }),
                k.pos(k.width() / 2, k.height() / 2 - 20),
                k.anchor("center"),
                k.color(100, 200, 255),
                k.opacity(0.3),
                k.z(0)
            ]);

            k.add([
                k.rect(620, 240, { radius: 20 }),
                k.pos(k.width() / 2, k.height() / 2 - 20),
                k.anchor("center"),
                k.color(255, 255, 255),
                k.opacity(0.92),
                k.z(1)
            ]);

            // Camera option
            k.add([
                k.text("🎮 Camera Control (Optional)", { size: 24 }),
                k.pos(k.width() / 2, k.height() / 2 - 90),
                k.anchor("center"),
                k.color(80, 80, 180),
                k.z(2)
            ]);

            const step1Text = k.add([
                k.text("1. Click 📷 Start Camera", { size: 20 }),
                k.pos(k.width() / 2, k.height() / 2 - 55),
                k.anchor("center"),
                k.color(100, 100, 100),
                k.z(2),
                "step1-text"
            ]);

            const step2Text = k.add([
                k.text("2. Choose Your Pose", { size: 20 }),
                k.pos(k.width() / 2, k.height() / 2 - 25),
                k.anchor("center"),
                k.color(100, 100, 100),
                k.z(2),
                "step2-text"
            ]);

            // OR separator with decoration
            k.add([
                k.text("✦", { size: 24 }),
                k.pos(k.width() / 2 - 100, k.height() / 2 + 15),
                k.anchor("center"),
                k.color(255, 180, 100),
                k.z(2)
            ]);

            k.add([
                k.text("OR", { size: 22 }),
                k.pos(k.width() / 2, k.height() / 2 + 15),
                k.anchor("center"),
                k.color(130, 130, 130),
                k.z(2)
            ]);

            k.add([
                k.text("✦", { size: 24 }),
                k.pos(k.width() / 2 + 100, k.height() / 2 + 15),
                k.anchor("center"),
                k.color(255, 180, 100),
                k.z(2)
            ]);

            k.add([
                k.text("⌨️ Press SPACE to Play", { size: 26 }),
                k.pos(k.width() / 2, k.height() / 2 + 55),
                k.anchor("center"),
                k.color(255, 130, 30),
                k.z(2)
            ]);

            // Multi-layer glow for button
            const buttonGlowLayers = [
                { size: 350, opacity: 0.08, color: [150, 255, 150] },
                { size: 320, opacity: 0.12, color: [100, 255, 100] },
                { size: 290, opacity: 0.18, color: [100, 240, 100] }
            ];

            buttonGlowLayers.forEach((layer, i) => {
                const glow = k.add([
                    k.circle(layer.size / 2),
                    k.pos(k.width() / 2, k.height() / 2 + 140),
                    k.anchor("center"),
                    k.color(layer.color[0], layer.color[1], layer.color[2]),
                    k.opacity(layer.opacity),
                    k.z(-1),
                    "button-glow"
                ]);

                glow.onUpdate(() => {
                    const t = k.time() * 1.5 + i * 0.3;
                    glow.opacity = layer.opacity + Math.sin(t) * 0.05;
                });
            });

            // Button shadow/border
            k.add([
                k.rect(290, 85, { radius: 43 }),
                k.pos(k.width() / 2, k.height() / 2 + 140),
                k.anchor("center"),
                k.color(50, 150, 50),
                k.opacity(0.6),
                k.z(0)
            ]);

            const startBtn = k.add([
                k.rect(280, 75, { radius: 38 }),
                k.pos(k.width() / 2, k.height() / 2 + 140),
                k.anchor("center"),
                k.color(100, 220, 100),
                k.area(),
                k.z(1),
                k.scale(1),
                "button"
            ]);

            // Enhanced pulsing effect for button
            startBtn.onUpdate(() => {
                const t = k.time() * 1.5;
                const pulse = 1 + Math.sin(t) * 0.05;
                if (!startBtn.isHovering()) {
                    startBtn.scale = k.vec2(pulse);
                }
                // Color pulsing
                const colorPulse = 220 + Math.sin(t * 2) * 20;
                startBtn.color = k.rgb(100, colorPulse, 100);
            });

            // Enhanced sparkles near button - more and bigger
            const sparklePositions = [
                { x: k.width() / 2 - 180, y: k.height() / 2 + 120, emoji: "✨" },
                { x: k.width() / 2 + 180, y: k.height() / 2 + 120, emoji: "✨" },
                { x: k.width() / 2 - 170, y: k.height() / 2 + 160, emoji: "💫" },
                { x: k.width() / 2 + 170, y: k.height() / 2 + 160, emoji: "💫" },
                { x: k.width() / 2 - 200, y: k.height() / 2 + 140, emoji: "⭐" },
                { x: k.width() / 2 + 200, y: k.height() / 2 + 140, emoji: "⭐" }
            ];

            sparklePositions.forEach((pos, i) => {
                const sparkle = k.add([
                    k.text(pos.emoji, { size: 32 }),
                    k.pos(pos.x, pos.y),
                    k.anchor("center"),
                    k.opacity(0.8),
                    k.rotate(0),
                    k.scale(1),
                    k.z(2),
                    "sparkle"
                ]);

                // Enhanced animation
                sparkle.onUpdate(() => {
                    const t = k.time() * 2 + i * 0.5;
                    sparkle.opacity = 0.5 + Math.sin(t) * 0.5;
                    sparkle.angle = Math.sin(t * 0.8) * 20;
                    sparkle.scale = k.vec2(1 + Math.sin(t * 1.5) * 0.2);
                });
            });

            // Radial light rays around button
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const ray = k.add([
                    k.rect(4, 60, { radius: 2 }),
                    k.pos(k.width() / 2, k.height() / 2 + 140),
                    k.anchor("center"),
                    k.rotate(angle * 180 / Math.PI),
                    k.color(255, 255, 150),
                    k.opacity(0.3),
                    k.z(-1),
                    "ray"
                ]);

                ray.onUpdate(() => {
                    const t = k.time() * 2 + i * 0.2;
                    ray.opacity = 0.2 + Math.sin(t) * 0.2;
                    const distance = 80 + Math.sin(t) * 15;
                    ray.pos.x = k.width() / 2 + Math.cos(angle) * distance;
                    ray.pos.y = k.height() / 2 + 140 + Math.sin(angle) * distance;
                });
            }

            // Listen for camera start
            const handleCameraStarted = () => {
                step1Text.color = k.rgb(100, 255, 100); // Green
                step2Text.color = k.rgb(255, 255, 100); // Yellow
            };
            window.addEventListener('cameraStarted', handleCameraStarted);

            // Listen for pose selection
            const handlePoseSelected = () => {
                step2Text.color = k.rgb(100, 255, 100); // Green
            };
            window.addEventListener('poseSelected', handlePoseSelected);

            // Clean up listeners when leaving scene
            k.onSceneLeave(() => {
                window.removeEventListener('cameraStarted', handleCameraStarted);
                window.removeEventListener('poseSelected', handlePoseSelected);
            });

            k.add([
                k.text("🚀 START GAME 🚀", { size: 30 }),
                k.pos(k.width() / 2, k.height() / 2 + 140),
                k.anchor("center"),
                k.color(255, 255, 255),
                k.z(2)
            ]);

            // Button hover effect - enhanced
            startBtn.onHover(() => {
                startBtn.color = k.rgb(150, 255, 150);
                startBtn.scale = k.vec2(1.15);

                // Create burst effect on hover
                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * Math.PI * 2;
                    const particle = k.add([
                        k.circle(5),
                        k.pos(k.width() / 2, k.height() / 2 + 140),
                        k.anchor("center"),
                        k.color(255, 255, 150),
                        k.opacity(0.8),
                        k.z(3),
                        "hover-particle"
                    ]);

                    const speed = 150 + Math.random() * 50;
                    const lifetime = 0.8;

                    particle.onUpdate(() => {
                        particle.pos.x += Math.cos(angle) * speed * k.dt();
                        particle.pos.y += Math.sin(angle) * speed * k.dt();
                        particle.opacity -= k.dt() / lifetime;

                        if (particle.opacity <= 0) {
                            k.destroy(particle);
                        }
                    });
                }
            });

            startBtn.onHoverEnd(() => {
                startBtn.color = k.rgb(100, 220, 100);
                startBtn.scale = k.vec2(1);
            });

            // Start game
            function tryStartGame() {
                // If camera is active, pose must be selected
                if (cameraActive && !poseSelected) {
                    // Flash Step 2 as warning
                    const step2 = k.get("step2-text")[0];
                    if (step2) {
                        step2.color = k.rgb(255, 100, 100);
                        k.wait(0.3, () => {
                            step2.color = k.rgb(255, 255, 100);
                        });
                    }
                    return;
                }

                // Start game (keyboard control if no camera)
                poseSelector.classList.remove('visible');
                k.go("game");
            }

            startBtn.onClick(() => {
                // Click animation - firework effect
                for (let i = 0; i < 20; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const emojis = ["⭐", "✨", "💫", "🌟"];
                    const emoji = emojis[Math.floor(Math.random() * emojis.length)];

                    const particle = k.add([
                        k.text(emoji, { size: 20 + Math.random() * 15 }),
                        k.pos(k.width() / 2, k.height() / 2 + 140),
                        k.anchor("center"),
                        k.opacity(1),
                        k.rotate(0),
                        k.z(10),
                        "click-particle"
                    ]);

                    const speed = 200 + Math.random() * 150;
                    const lifetime = 1 + Math.random() * 0.5;
                    const rotSpeed = (Math.random() - 0.5) * 360;

                    particle.onUpdate(() => {
                        particle.pos.x += Math.cos(angle) * speed * k.dt();
                        particle.pos.y += Math.sin(angle) * speed * k.dt() - 100 * k.dt();
                        particle.angle += rotSpeed * k.dt();
                        particle.opacity -= k.dt() / lifetime;

                        if (particle.opacity <= 0) {
                            k.destroy(particle);
                        }
                    });
                }

                tryStartGame();
            });

            k.onKeyPress("space", () => {
                // Same firework effect for keyboard
                for (let i = 0; i < 20; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const emojis = ["⭐", "✨", "💫", "🌟"];
                    const emoji = emojis[Math.floor(Math.random() * emojis.length)];

                    const particle = k.add([
                        k.text(emoji, { size: 20 + Math.random() * 15 }),
                        k.pos(k.width() / 2, k.height() / 2 + 140),
                        k.anchor("center"),
                        k.opacity(1),
                        k.rotate(0),
                        k.z(10),
                        "click-particle"
                    ]);

                    const speed = 200 + Math.random() * 150;
                    const lifetime = 1 + Math.random() * 0.5;
                    const rotSpeed = (Math.random() - 0.5) * 360;

                    particle.onUpdate(() => {
                        particle.pos.x += Math.cos(angle) * speed * k.dt();
                        particle.pos.y += Math.sin(angle) * speed * k.dt() - 100 * k.dt();
                        particle.angle += rotSpeed * k.dt();
                        particle.opacity -= k.dt() / lifetime;

                        if (particle.opacity <= 0) {
                            k.destroy(particle);
                        }
                    });
                }

                tryStartGame();
            });

            // Bottom instructions background with border
            k.add([
                k.rect(710, 65, { radius: 15 }),
                k.pos(k.width() / 2, k.height() - 40),
                k.anchor("center"),
                k.color(255, 220, 100),
                k.opacity(0.4),
                k.z(0)
            ]);

            k.add([
                k.rect(700, 55, { radius: 15 }),
                k.pos(k.width() / 2, k.height() - 40),
                k.anchor("center"),
                k.color(255, 255, 255),
                k.opacity(0.9),
                k.z(1)
            ]);

            // Instructions at bottom
            k.add([
                k.text("🎯 Controls: SPACE / Click / Tap / Pose", { size: 20 }),
                k.pos(k.width() / 2, k.height() - 52),
                k.anchor("center"),
                k.color(80, 80, 80),
                k.z(2)
            ]);

            k.add([
                k.text("🎮 Avoid 🌵 • Collect 💰", { size: 20 }),
                k.pos(k.width() / 2, k.height() - 28),
                k.anchor("center"),
                k.color(80, 80, 80),
                k.z(2)
            ]);

            // Decorative corner elements
            const coinEffect = k.add([
                k.text("💰", { size: 28 }),
                k.pos(k.width() / 2 - 380, k.height() - 40),
                k.anchor("center"),
                k.z(2),
                "coin-deco"
            ]);

            const cactusEffect = k.add([
                k.text("🌵", { size: 28 }),
                k.pos(k.width() / 2 + 380, k.height() - 40),
                k.anchor("center"),
                k.z(2),
                "cactus-deco"
            ]);

            // Bouncing animations
            coinEffect.onUpdate(() => {
                const t = k.time() * 3;
                coinEffect.pos.y = k.height() - 40 + Math.sin(t) * 5;
            });

            cactusEffect.onUpdate(() => {
                const t = k.time() * 3 + 1.5;
                cactusEffect.pos.y = k.height() - 40 + Math.sin(t) * 5;
            });
        });

        // Start with menu
        k.go("menu");
    </script>
</body>
</html>
